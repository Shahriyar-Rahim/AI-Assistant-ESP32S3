[platformio]
default_envs = esp32-s3-n16r8
src_dir = main

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-n16r8
framework = espidf
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -I include
